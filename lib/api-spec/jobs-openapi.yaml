openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: >
    Authenticated Job Manager API. Send the configured API key as a Bearer token in the
    Authorization header. Adding a part to a job takes stock from the Stock Control API and,
    for any shortfall, adds a line to a Draft order in the Ordering API.
servers:
  - url: /jobs-api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: jobs
    description: Job operations
  - name: parts
    description: Stock parts available to add to a job
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status, including database connectivity.
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Database unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /parts:
    get:
      operationId: listParts
      tags: [parts]
      summary: List stock parts
      description: Proxies the Stock Control API so the browser never needs the stock API key.
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Case-insensitive partial match on Part Number.
      responses:
        "200":
          description: Stock parts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Part"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "502":
          $ref: "#/components/responses/UpstreamFailure"
  /jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List jobs
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Case-insensitive partial match on Job Id, Client or a Part Number on the job.
      responses:
        "200":
          description: Job summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createJob
      tags: [jobs]
      summary: Create a job
      description: The Job Id is generated by the server (JOB-0001, JOB-0002, ...).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobInput"
      responses:
        "201":
          description: Job created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /jobs/summary:
    get:
      operationId: getJobSummary
      tags: [jobs]
      summary: Get job summary
      description: >
        Returns totals across all jobs. totalValue is computed from the current Stock Control
        cost of each allocated/ordered part, fetched over the Stock Control API.
      responses:
        "200":
          description: Job summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobSummaryTotals"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /job/{jobId}:
    get:
      operationId: getJob
      tags: [jobs]
      summary: Retrieve a job with its parts
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateJob
      tags: [jobs]
      summary: Update a job's details
      description: Changes the job header only. Use the parts endpoints to change parts.
      parameters:
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobUpdate"
      responses:
        "200":
          description: Updated job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteJob
      tags: [jobs]
      summary: Delete a job
      description: A job that still has parts cannot be deleted (409); remove its parts first so stock is returned.
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "204":
          description: Job deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Job still has parts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /job/{jobId}/parts:
    post:
      operationId: addJobPart
      tags: [jobs]
      summary: Add a part to a job
      description: >
        Takes as much of the requested quantity as is in stock (Stock Control
        POST /stock/{partNumber}/adjust). Any shortfall is added to a Draft order in the
        Ordering API whose reference is the Job Id (a Draft order is created if none exists).
        Adding a part that is already on the job increases its quantity.
      parameters:
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobPartInput"
      responses:
        "201":
          description: Part added to the job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobPart"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Job or stock part not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          $ref: "#/components/responses/UpstreamFailure"
  /job/{jobId}/parts/{partNumber}:
    delete:
      operationId: removeJobPart
      tags: [jobs]
      summary: Remove a part from a job
      description: >
        Returns the quantity taken from stock back to stock. Any quantity already placed on a
        Draft order is left on that order; edit the order in the Ordering app if it is no longer needed.
      parameters:
        - $ref: "#/components/parameters/JobId"
        - $ref: "#/components/parameters/PartNumber"
      responses:
        "204":
          description: Part removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/UpstreamFailure"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
      description: Use the configured JOBS_API_KEY (falls back to STOCK_API_KEY) as the bearer token.
  parameters:
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
      description: The unique Job Id, e.g. JOB-0001.
    PartNumber:
      name: partNumber
      in: path
      required: true
      schema:
        type: string
        minLength: 1
      description: The stock Part Number.
  responses:
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UpstreamFailure:
      description: The Stock Control or Ordering API failed or could not be reached
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum: [ok, error]
        database:
          type: string
          enum: [ok, error]
      required:
        - status
        - database
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    Part:
      type: object
      properties:
        partNumber:
          type: string
        itemName:
          type: string
        description:
          type: string
        quantity:
          type: integer
          description: Quantity currently in stock.
        binNumber:
          type: string
      required:
        - partNumber
        - itemName
        - description
        - quantity
        - binNumber
    JobPart:
      type: object
      properties:
        partNumber:
          type: string
        description:
          type: string
        quantity:
          type: integer
          minimum: 1
          description: Total quantity the job needs.
        quantityAllocated:
          type: integer
          minimum: 0
          description: Quantity taken from stock.
        quantityOrdered:
          type: integer
          minimum: 0
          description: Quantity placed on a Draft order because stock was short.
        draftOrderNumber:
          type: [string, "null"]
          description: The Draft order holding the shortfall, if any.
      required:
        - partNumber
        - description
        - quantity
        - quantityAllocated
        - quantityOrdered
        - draftOrderNumber
    JobPartInput:
      type: object
      properties:
        partNumber:
          type: string
          minLength: 1
        quantity:
          type: integer
          minimum: 1
      required:
        - partNumber
        - quantity
    Job:
      type: object
      properties:
        jobId:
          type: string
        jobDate:
          type: string
          format: date
        client:
          type: string
        clientAddress:
          type: string
        description:
          type: string
        parts:
          type: array
          items:
            $ref: "#/components/schemas/JobPart"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - jobId
        - jobDate
        - client
        - clientAddress
        - description
        - parts
        - createdAt
        - updatedAt
    JobInput:
      type: object
      properties:
        jobDate:
          type: string
          format: date
        client:
          type: string
          minLength: 1
        clientAddress:
          type: string
        description:
          type: string
      required:
        - jobDate
        - client
        - clientAddress
        - description
    JobUpdate:
      type: object
      properties:
        jobDate:
          type: string
          format: date
        client:
          type: string
          minLength: 1
        clientAddress:
          type: string
        description:
          type: string
      minProperties: 1
    JobSummary:
      type: object
      properties:
        jobId:
          type: string
        jobDate:
          type: string
          format: date
        client:
          type: string
        description:
          type: string
        partCount:
          type: integer
      required:
        - jobId
        - jobDate
        - client
        - description
        - partCount
    JobSummaryTotals:
      type: object
      properties:
        jobCount:
          type: integer
          description: Total number of jobs.
        partCount:
          type: integer
          description: Total number of part lines across all jobs.
        totalQuantity:
          type: integer
          description: Sum of quantity across all job parts.
        totalValue:
          type: number
          description: Sum of quantity * Stock Control cost across all job parts. Parts no longer in stock contribute 0.
      required:
        - jobCount
        - partCount
        - totalQuantity
        - totalValue
