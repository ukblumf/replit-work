kind = "web"
previewPath = "/stock-control/"
title = "Stock Control"
description = "A focused stock control workspace for small businesses to maintain parts, quantities, pricing, and bin locations, with an authenticated JSON API for integrations."
version = "1.0.0"
id = "artifacts/stock-control"
router = "path"

[[services]]
name = "web"
paths = [ "/stock-control/" ]
localPort = 19219

[services.development]
run = "pnpm --filter @workspace/stock-control run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/stock-control", "run", "build" ]
serve = "static"
publicDir = "artifacts/stock-control/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19219"
BASE_PATH = "/stock-control/"
